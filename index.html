<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
        // Configuration
        const CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { 
                    urls: 'turn:your-turn-server.com:5349',
                    username: 'your_turn_username',
                    credential: 'your_turn_password'
                }
            ],
            peerjs: {
                host: 'your-peerjs-server.com',
                port: 443,
                path: '/peerjs',
                secure: true
            }
        };

let peer;
        let currentPeerId;
        let conn;
let localStream;
        let isTyping = false;
        let typingTimeout;
        let remoteStream;

async function startConnection() {
            const username = document.getElementById('username').value;
            if (!username) return alert('Please choose a username!');

            // Hide login and show loading
            document.getElementById('login').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            // Initialize PeerJS
            peer = new Peer(username, {
                host: '0.peerjs.com',
                port: 443,
                path: '/'
            });

            // Get webcam access
try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                const username = document.getElementById('username').value.trim();
                if (!username) return alert('Please enter a username');
                
                document.getElementById('login').style.display = 'none';
                document.getElementById('loading').style.display = 'flex';

                // Initialize PeerJS with enhanced configuration
                peer = new Peer(username, {
                    ...CONFIG.peerjs,
                    config: CONFIG
});

                // Get media stream with mobile-friendly constraints
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

document.getElementById('localVideo').srcObject = localStream;

                setupPeerEvents();
                setupConnectionHandlers();

} catch (error) {
                alert('Failed to access webcam!');
                location.reload();
                handleError(error);
}
        }

            // PeerJS event handlers
        function setupPeerEvents() {
peer.on('open', id => {
                console.log('Connected with ID:', id);
findPartner();
});

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('loading').style.display = 'none';
                });
            peer.on('error', error => {
                console.error('PeerJS Error:', error);
                handleError(error);
});

            peer.on('connection', conn => {
                conn.on('data', data => {
                    if(data.type === 'typing') {
                        showTyping(data.isTyping);
                    } else {
                        appendMessage('Partner', data);
                    }
                });
            peer.on('call', async call => {
                try {
                    call.answer(localStream);
                    call.on('stream', stream => handleRemoteStream(stream));
                    call.on('error', error => handleError(error));
                } catch (error) {
                    handleError(error);
                }
});
}

        function findPartner() {
            peer.listAllPeers(peers => {
        async function findPartner() {
            try {
                const peers = await peer.listAllPeers();
const availablePeers = peers.filter(p => p !== peer.id);
                
if (availablePeers.length > 0) {
                    currentPeerId = availablePeers[Math.floor(Math.random() * availablePeers.length)];
                    connectToPeer(currentPeerId);
                    const partnerId = availablePeers[Math.floor(Math.random() * availablePeers.length)];
                    connectToPartner(partnerId);
} else {
setTimeout(findPartner, 2000);
}
            });
            } catch (error) {
                handleError(error);
            }
}

        function connectToPeer(peerId) {
            const conn = peer.connect(peerId);
            const call = peer.call(peerId, localStream);
        function connectToPartner(partnerId) {
            try {
                // Establish data connection
                conn = peer.connect(partnerId, {
                    reliable: true,
                    serialization: 'json'
                });

            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('loading').style.display = 'none';
            });
                // Establish media call
                const call = peer.call(partnerId, localStream);
                call.on('stream', stream => handleRemoteStream(stream));
                call.on('error', error => handleError(error));

            conn.on('open', () => {
                conn.send('👋 Hello! Ready to chat?');
            });
                // Set up data channel
                conn.on('data', handleDataMessage);
                conn.on('open', () => {
                    console.log('Data channel opened');
                    sendSystemMessage('Connection established');
                });

            conn.on('data', data => {
                if(data.type === 'typing') {
                    showTyping(data.isTyping);
                } else {
                    appendMessage('Partner', data);
                }
            });
            } catch (error) {
                handleError(error);
            }
        }

        function handleRemoteStream(stream) {
            remoteStream = stream;
            document.getElementById('remoteVideo').srcObject = remoteStream;
            document.getElementById('loading').style.display = 'none';
        }

        function handleDataMessage(data) {
            if (data.type === 'message') {
                appendMessage('Partner', data.content);
            } else if (data.type === 'typing') {
                showTypingIndicator(data.isTyping);
            }
}

function sendMessage() {
            const message = document.getElementById('message').value;
            const message = document.getElementById('message').value.trim();
if (!message) return;

            const conn = peer.connect(currentPeerId);
            conn.send(message);
            conn.send({
                type: 'message',
                content: message,
                timestamp: new Date().toISOString()
            });

appendMessage('You', message);
document.getElementById('message').value = '';
            sendTypingStatus(false);
}

        function handleTyping(isKeyDown) {
            if(isKeyDown && !isTyping) {
                isTyping = true;
                sendTypingStatus(true);
        function handleTyping() {
            conn.send({
                type: 'typing',
                isTyping: document.getElementById('message').value.length > 0
            });
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
}
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                sendTypingStatus(false);
            }, 1000);
}

        function sendTypingStatus(isTyping) {
            const conn = peer.connect(currentPeerId);
            conn.send({ type: 'typing', isTyping: isTyping });
        function appendMessage(sender, content) {
            const chatBox = document.getElementById('chat');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.innerHTML = `
                <strong>${sender}:</strong> ${content}
                <span class="timestamp">${new Date().toLocaleTimeString()}</span>
            `;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleError(error) {
            console.error('Error:', error);
            alert(`Connection Error: ${error.message}`);
            location.reload();
}

        function showTyping(show) {
            document.querySelector('.typing-indicator').style.display = show ? 'block' : 'none';
        // Mobile touch handlers
        document.addEventListener('touchstart', handleTouch, { passive: true });
        document.addEventListener('touchend', handleTouchEnd);

}

            const chat = document.getElementById('chat');
            const message = document.createElement('div');
            message.className = 'message';
            message.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        function handleTouchEnd() {
            // Add mobile-specific touch handling if needed
}
