<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ConnectHub - Corner Cams</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Video Containers */
        .video-container {
            position: fixed;
            width: 250px;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #localVideo {
            top: 20px;
            left: 20px;
            border: 3px solid #4CAF50;
            transform: scaleX(-1);
            z-index: 2;
        }

        #remoteVideo {
            bottom: 20px;
            right: 20px;
            border: 3px solid #2196F3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Chat Interface */
        .chat-interface {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transform: translateX(0);
            animation: slideInRight 0.5s ease-out;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        /* Messages */
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            animation: messagePop 0.3s ease-out;
            transform-origin: left;
        }

        @keyframes messagePop {
            from { transform: scale(0.9) translateX(20px); opacity: 0; }
            to { transform: scale(1) translateX(0); opacity: 1; }
        }

        /* Input & Buttons */
        .message-input {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(33,150,243,0.3);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #2196F3, #4CAF50);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
        }

        button:active {
            transform: translateY(1px);
            filter: brightness(0.9);
        }

        /* Login Screen */
        #login {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: loginEnter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes loginEnter {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* Typing Indicator */
        .typing-indicator {
            position: fixed;
            bottom: 80px;
            right: 380px;
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 20px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div class="section active" id="login">
        <h1 style="animation: float 3s ease-in-out infinite">ConnectHub 🚀</h1>
        <input type="text" placeholder="Your Cool Username" id="username">
        <button onclick="startConnection()" class="pulse">Start Chatting!</button>
    </div>

    <!-- Video Elements -->
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>

    <!-- Chat Interface -->
    <div class="chat-interface">
        <div class="chat-box" id="chat"></div>
        <div class="message-input">
            <input type="text" id="message" 
                   placeholder="Type something awesome..."
                   onkeydown="handleTyping(true)"
                   onkeyup="handleTyping(false)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading">
        <div class="loader"></div>
        <p style="margin-top: 20px;">Finding your chat partner...</p>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        let peer;
        let currentPeerId;
        let localStream;
        let isTyping = false;
        let typingTimeout;

        async function startConnection() {
            const username = document.getElementById('username').value;
            if (!username) return alert('Please choose a username!');

            // Hide login and show loading
            document.getElementById('login').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            // Initialize PeerJS
            peer = new Peer(username, {
                host: '0.peerjs.com',
                port: 443,
                path: '/'
            });

            // Get webcam access
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (error) {
                alert('Failed to access webcam!');
                location.reload();
            }

            // PeerJS event handlers
            peer.on('open', id => {
                findPartner();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('loading').style.display = 'none';
                });
            });

            peer.on('connection', conn => {
                conn.on('data', data => {
                    if(data.type === 'typing') {
                        showTyping(data.isTyping);
                    } else {
                        appendMessage('Partner', data);
                    }
                });
            });
        }

        function findPartner() {
            peer.listAllPeers(peers => {
                const availablePeers = peers.filter(p => p !== peer.id);
                if (availablePeers.length > 0) {
                    currentPeerId = availablePeers[Math.floor(Math.random() * availablePeers.length)];
                    connectToPeer(currentPeerId);
                } else {
                    setTimeout(findPartner, 2000);
                }
            });
        }

        function connectToPeer(peerId) {
            const conn = peer.connect(peerId);
            const call = peer.call(peerId, localStream);

            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('loading').style.display = 'none';
            });

            conn.on('open', () => {
                conn.send('👋 Hello! Ready to chat?');
            });

            conn.on('data', data => {
                if(data.type === 'typing') {
                    showTyping(data.isTyping);
                } else {
                    appendMessage('Partner', data);
                }
            });
        }

        function sendMessage() {
            const message = document.getElementById('message').value;
            if (!message) return;

            const conn = peer.connect(currentPeerId);
            conn.send(message);
            appendMessage('You', message);
            document.getElementById('message').value = '';
            sendTypingStatus(false);
        }

        function handleTyping(isKeyDown) {
            if(isKeyDown && !isTyping) {
                isTyping = true;
                sendTypingStatus(true);
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                sendTypingStatus(false);
            }, 1000);
        }

        function sendTypingStatus(isTyping) {
            const conn = peer.connect(currentPeerId);
            conn.send({ type: 'typing', isTyping: isTyping });
        }

        function showTyping(show) {
            document.querySelector('.typing-indicator').style.display = show ? 'block' : 'none';
        }

        function appendMessage(sender, text) {
            const chat = document.getElementById('chat');
            const message = document.createElement('div');
            message.className = 'message';
            message.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
