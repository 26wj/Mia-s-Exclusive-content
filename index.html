<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Preview Pro</title>
    <style>
        :root {
            --primary: #ff0000;
            --dark: #0f0f0f;
            --light: #ffffff;
            --gray: #272727;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--dark);
            color: var(--light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(45deg, var(--primary), #cc0000);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        .search-section {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        #searchInput {
            width: 500px;
            padding: 15px;
            border-radius: 30px;
            border: 2px solid var(--gray);
            background: var(--dark);
            color: var(--light);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        button {
            padding: 15px 30px;
            background-color: var(--primary);
            color: var(--light);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        .video-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .video-item {
            background: var(--gray);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 3px solid var(--primary);
        }

        .video-info {
            padding: 15px;
        }

        .video-info h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-name {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .preview-section {
            background: var(--gray);
            padding: 25px;
            border-radius: 15px;
            margin-top: 40px;
        }

        #previewInput {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: 2px solid var(--dark);
            background: var(--dark);
            color: var(--light);
            margin-bottom: 20px;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary);
            font-size: 24px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            display: none;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { bottom: -50px; }
            to { bottom: 20px; }
        }

        @media (max-width: 768px) {
            #searchInput {
                width: 100%;
            }
            
            .search-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 YT Preview Pro</h1>
            <p>Search, Copy & Preview YouTube Videos</p>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search for videos...">
            <button onclick="searchVideos()">Search</button>
        </div>

        <div class="video-results" id="videoResults"></div>

        <div class="preview-section">
            <input type="text" id="previewInput" placeholder="Paste YouTube URL here to preview">
            <button onclick="loadPreview()">▶ Play Preview</button>
            <div id="videoContainer">
                <iframe id="videoPlayer"></iframe>
            </div>
        </div>

        <div class="loading">🔍 Searching...</div>
        <div class="toast" id="toast">Link copied! 📋</div>
    </div>

    <script>
        // ... (Keep the previous JavaScript code but update the following functions)

        async function searchVideos() {
            const searchQuery = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('videoResults');
            const loading = document.querySelector('.loading');
            
            loading.style.display = 'block';
            resultsContainer.innerHTML = '';

            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(searchQuery)}&key=${AIzaSyD4yUxN4O77l3d2j-poHLgaMAB5qTIeVKo}&type=video`
                );
                
                const data = await response.json();
                loading.style.display = 'none';
                displayResults(data.items);
            } catch (error) {
                loading.style.display = 'none';
                showToast('⚠️ Error loading results');
                console.error(error);
            }
        }

        function copyVideoUrl(videoId) {
            const url = `https://www.youtube.com/watch?v=${videoId}`;
            navigator.clipboard.writeText(url);
            showToast('🔗 Link copied!');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        // Add this new function
        function animateElements() {
            const videoItems = document.querySelectorAll('.video-item');
            videoItems.forEach((item, index) => {
                setTimeout(() => {
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }

        // Update displayResults function
        function displayResults(videos) {
            const resultsContainer = document.getElementById('videoResults');
            resultsContainer.innerHTML = '';

            videos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <img class="video-thumbnail" src="${video.snippet.thumbnails.medium.url}">
                    <div class="video-info">
                        <h4>${video.snippet.title}</h4>
                        <p class="channel-name">${video.snippet.channelTitle}</p>
                        <button onclick="copyVideoUrl('${video.id.videoId}')">📋 Copy Link</button>
                    </div>
                `;
                videoItem.style.opacity = '0';
                videoItem.style.transform = 'translateY(20px)';
                resultsContainer.appendChild(videoItem);
            });

            animateElements();
        }
    </script>
</body>
</html>
