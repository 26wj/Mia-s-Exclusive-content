<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Chat</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --background: #1a1a1a;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: white;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 45%;
            height: 40vh;
            border-radius: 10px;
            overflow: hidden;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #remoteVideo {
            border: 3px solid var(--secondary);
        }

        #localVideo {
            border: 3px solid var(--primary);
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #chat {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 300px;
            height: 60vh;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin: 8px 0;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="chat"></div>

    <div class="controls">
        <button onclick="startCall()">Start Call</button>
        <button onclick="endCall()" style="background: #ff4444;">End Call</button>
    </div>

    <script>
        let pc;
        let localStream;
        const signalingServer = new WebSocket('wss://free-signaling-server.herokuapp.com');

        async function startCall() {
            try {
                // Get user media
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;

                // Create peer connection
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // Add local stream to connection
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // Setup ice candidate exchange
                pc.onicecandidate = ({ candidate }) => {
                    if (candidate) {
                        signalingServer.send(JSON.stringify({
                            type: 'candidate',
                            candidate
                        }));
                    }
                };

                // Handle remote stream
                pc.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                // Create data channel for chat
                const dataChannel = pc.createDataChannel('chat');
                setupDataChannel(dataChannel);

                // Create offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                signalingServer.send(JSON.stringify({
                    type: 'offer',
                    offer: pc.localDescription
                }));
            } catch (err) {
                console.error('Error starting call:', err);
            }
        }

        function setupDataChannel(channel) {
            channel.onopen = () => {
                console.log('Data channel opened');
                addMessage('System', 'Chat connected!');
            };

            channel.onmessage = (event) => {
                addMessage('Partner', event.data);
            };
        }

        signalingServer.onmessage = async (message) => {
            const data = JSON.parse(message.data);
            
            if (!pc) {
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.onicecandidate = ({ candidate }) => {
                    if (candidate) {
                        signalingServer.send(JSON.stringify({
                            type: 'candidate',
                            candidate
                        }));
                    }
                };

                pc.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                pc.ondatachannel = (event) => {
                    setupDataChannel(event.channel);
                };
            }

            try {
                if (data.offer) {
                    await pc.setRemoteDescription(data.offer);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    signalingServer.send(JSON.stringify({
                        type: 'answer',
                        answer: pc.localDescription
                    }));
                } else if (data.answer) {
                    await pc.setRemoteDescription(data.answer);
                } else if (data.candidate) {
                    await pc.addIceCandidate(data.candidate);
                }
            } catch (err) {
                console.error('Signaling error:', err);
            }
        };

        function addMessage(sender, text) {
            const chat = document.getElementById('chat');
            const message = document.createElement('div');
            message.className = 'message';
            message.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        function endCall() {
            if (pc) {
                pc.close();
                pc = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('remoteVideo').srcObject = null;
            addMessage('System', 'Call ended');
        }

        // Chat functionality
        window.sendMessage = function() {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Type message...';
            
            input.onkeypress = (e) => {
                if (e.key === 'Enter' && input.value) {
                    const channel = pc?.dataChannels?.chat;
                    if (channel?.readyState === 'open') {
                        channel.send(input.value);
                        addMessage('You', input.value);
                    }
                    input.remove();
                }
            };
            
            document.body.appendChild(input);
            input.focus();
        };
    </script>
</body>
</html>
