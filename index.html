<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working YouTube Viewer</title>
    <style>
        :root {
            --yt-red: #ff0000;
            --yt-dark: #0f0f0f;
            --yt-light: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--yt-dark);
            color: var(--yt-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 12px;
            border-radius: 24px;
            border: 1px solid #333;
            background: #272727;
            color: white;
        }

        button {
            padding: 12px 24px;
            background: var(--yt-red);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: #272727;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        #player {
            width: 100%;
            height: 600px;
            border: none;
            margin-top: 20px;
        }

        .error {
            color: var(--yt-red);
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search videos...">
            <button onclick="searchVideos()">Search</button>
        </div>
        
        <div class="video-grid" id="videoGrid"></div>
        <div id="player"></div>
        <div id="errorMessage" class="error"></div>
    </div>

<script>
const API_KEY = 'AIzaSyD4yUxN4O77l3d2j-poHLgaMAB5qTIeVKo';

async function searchVideos() {
    const searchQuery = document.getElementById('searchInput').value.trim();
    if (!searchQuery) return;

    try {
        // Direct YouTube API call
        const response = await fetch(
            `https://www.googleapis.com/youtube/v3/search?` +
            `part=snippet&` +
            `maxResults=12&` +
            `q=${encodeURIComponent(searchQuery)}&` +
            `key=${API_KEY}&` +
            `type=video`
        );

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error.message || 'API request failed');
        }

        const data = await response.json();
        displayVideos(data.items);
    } catch (error) {
        showError(`Error: ${error.message}`);
        console.error('Search error:', error);
    }
}

function displayVideos(videos) {
    const grid = document.getElementById('videoGrid');
    grid.innerHTML = '';

    videos.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <img class="thumbnail" 
                 src="${video.snippet.thumbnails.medium.url}" 
                 alt="${video.snippet.title}">
            <div style="padding: 12px">
                <h3>${video.snippet.title}</h3>
                <p>${video.snippet.channelTitle}</p>
            </div>
        `;

        card.addEventListener('click', () => {
            playVideo(video.id.videoId);
        });

        grid.appendChild(card);
    });
}

function playVideo(videoId) {
    const player = document.getElementById('player');
    player.innerHTML = `
        <iframe 
            width="100%" 
            height="100%" 
            src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
            frameborder="0" 
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    `;
}

function showError(message) {
    document.getElementById('errorMessage').textContent = message;
    setTimeout(() => {
        document.getElementById('errorMessage').textContent = '';
    }, 5000);
}

// Security recommendation
console.warn('For production use:');
console.warn('1. Go to Google Cloud Console → APIs & Services → Credentials');
console.warn('2. Restrict your API key to HTTP referrers');
console.warn('3. Enable only YouTube Data API v3 for this key');
</script>
</body>
</html>
