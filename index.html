<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working AI Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .chat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            height: 70vh;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }

        .user-message {
            background: var(--primary);
            margin-left: auto;
        }

        .ai-message {
            background: #2d3748;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 5px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-box" id="chatBox"></div>
        <input type="text" id="userInput" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const API_KEY = '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';
        
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = userInput.value.trim();
            
            if (!message) return;

            // Add user message
            chatBox.innerHTML += `
                <div class="message user-message">
                    ${message}
                </div>
            `;

            userInput.value = '';
            
            try {
                // Add loading indicator
                chatBox.innerHTML += `
                    <div class="message ai-message">
                        Thinking...
                    </div>
                `;

                const response = await fetch(
                    'https://api-inference.huggingface.co/models/google/flan-t5-xxl',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            inputs: message,
                            parameters: {
                                max_new_tokens: 100,
                                temperature: 0.9
                            }
                        })
                    }
                );

                const data = await response.json();
                
                // Remove loading indicator
                chatBox.lastElementChild.remove();

                if (data[0]?.generated_text) {
                    chatBox.innerHTML += `
                        <div class="message ai-message">
                            ${marked.parse(data[0].generated_text)}
                        </div>
                    `;
                } else {
                    throw new Error('The AI didn\'t respond properly');
                }
            } catch (error) {
                chatBox.lastElementChild.remove();
                chatBox.innerHTML += `
                    <div class="message ai-message" style="color: #ff4444">
                        Error: ${error.message}
                    </div>
                `;
            }

            // Scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter key support
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
