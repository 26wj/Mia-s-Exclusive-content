<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia's Premium Content Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF69B4;
            --secondary: #9400D3;
            --accent: #FFD700;
            --dark: #2F1B41;
            --light: #FFF5EE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(47, 27, 65, 0.90), rgba(47, 27, 65, 0.90)),
                        url('https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            color: var(--light);
            min-height: 100vh;
        }

        .header {
            padding: 1rem 5%;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            background: rgba(47, 27, 65, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--accent);
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            border: 2px solid var(--accent);
            transition: transform 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            justify-self: end;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .hero {
            padding: 160px 5% 60px;
            text-align: center;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-library {
            padding: 4rem 5%;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 3px solid var(--primary);
            cursor: pointer;
        }

        .price-tag {
            background: var(--accent);
            color: var(--dark);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 700;
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .file-info {
            padding: 1.5rem;
            display: grid;
            gap: 0.8rem;
        }

        .file-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: var(--secondary);
        }

        /* Preview Modal Styles */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            width: 90%;
            max-width: 1000px;
            margin: 2rem auto;
            background: var(--dark);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            transform: translateY(-50px);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .preview-video {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            margin: 1rem 0;
        }

        .preview-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .preview-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: var(--light);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .preview-close:hover {
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="https://i.postimg.cc/vcqhnw8n/pic-1.webp" 
             alt="Mia's Profile" 
             class="logo">
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#library">Library</a>
            <a href="#pricing">Pricing</a>
            <a href="#support">Support</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Premium Videos Cheap</h1>
            <p>Exclusive Content </p>
        </div>
    </section>

    <main class="video-library" id="library">
        <div class="video-grid">
            <!-- Video Item 1 -->
            <article class="video-card">
                <div class="thumbnail-container">
                    <img src="THUMBNAIL_IMAGE_URL_1" 
                         class="thumbnail" 
                         onclick="showPreview('GOOGLE_DRIVE_VIDEO_ID_1')">
                    <div class="price-tag">$49.99</div>
                </div>
                <div class="file-info">
                    <h3>Pussy Fingering</h3>
                    <div class="file-meta">
                        <span><i class="fas fa-clock"></i> 2h 45m</span>
                        <span><i class="fas fa-download"></i> 4K MP4</span>
                    </div>
                    <button class="btn" 
                            onclick="window.location.href='https://discord.com/users/1310460288814026852'">
                        <i class="fas fa-shopping-cart"></i>
                        Purchase Now
                    </button>
                </div>
            </article>

            <!-- Video Item 2 -->
            <article class="video-card">
                <div class="thumbnail-container">
                    <img src="THUMBNAIL_IMAGE_URL_2" 
                         class="thumbnail" 
                         onclick="showPreview('GOOGLE_DRIVE_VIDEO_ID_2')">
                    <div class="price-tag">$10</div>
                </div>
                <div class="file-info">
                    <h3>Cinematic Color Grading</h3>
                    <div class="file-meta">
                        <span><i class="fas fa-clock"></i> 3h 15m</span>
                        <span><i class="fas fa-download"></i> 4K MP4 + Assets</span>
                    </div>
                    <button class="btn" 
                            onclick="window.location.href='https://discord.com/users/1310460288814026852'">
                        <i class="fas fa-shopping-cart"></i>
                        Purchase Now
                    </button>
                </div>
            </article>
        </div>
    </main>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <div class="modal-content">
            <span class="preview-close" onclick="closePreview()">&times;</span>
            <div class="preview-video" id="videoContainer"></div>
            <div class="preview-actions">
                <button class="btn" onclick="closePreview()">
                    <i class="fas fa-times"></i>
                    Close Preview
                </button>
                <button class="btn" 
                        onclick="window.location.href='https://discord.com/users/YOUR_DISCORD_ID'">
                    <i class="fas fa-shopping-cart"></i>
                    Purchase Full Video
                </button>
            </div>
        </div>
    </div>

    <script>
        // Preview functionality
        function showPreview(videoId) {
            const modal = document.getElementById('previewModal');
            const videoContainer = document.getElementById('videoContainer');
            
            // Insert Google Drive embed URL
            videoContainer.innerHTML = `
                <iframe src="https://drive.google.com/file/d/${videoId}/preview" 
                        allow="autoplay" 
                        allowfullscreen></iframe>
            `;
            
            modal.style.display = 'block';
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
            document.getElementById('videoContainer').innerHTML = '';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('previewModal');
            if (event.target === modal) {
                closePreview();
            }
        }

        // Smooth scroll for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            });
        });
    </script>
</body>
</html>
