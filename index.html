<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-container label {
      display: block;
      margin: 8px 0 4px;
    }
    .form-container input, .form-container textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .form-container button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .form-container button:hover {
      background-color: #45a049;
    }
    .error-popup {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #f8d7da;
      color: #721c24;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      width: 80%;
      max-width: 400px;
      display: none;
    }
    .error-popup button {
      background-color: #721c24;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .error-popup button:hover {
      background-color: #5a1c20;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Submit Form</h2>
    <form id="form" action="https://formspree.io/f/mzzdaggy" method="POST" onsubmit="return handleSubmit(event)">
      <label for="email">Your Email:</label>
      <input type="email" name="email" id="email" required>

      <label for="phone">Your Phone Number:</label>
      <input type="text" name="phone" id="phone" required placeholder="e.g., 9763238745">

      <label for="message">Your Message:</label>
      <textarea name="message" id="message" required placeholder="Enter your message"></textarea>

      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Error Popup -->
  <div class="error-popup" id="errorPopup">
    <p>Invalid phone number. Please ensure it ends with.</p>
    <button onclick="closeErrorPopup()">Close</button>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault(); // Prevent form from submitting until validation

      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;

      // Validate phone number to ensure it ends with "45"
      const phoneRegex = 

      if (!phoneRegex.test(phone)) {
        // Show error popup if phone number doesn't end with "45"
        document.getElementById("errorPopup").style.display = "block";
        return false;
      } else {
        // Prepare the message by including the email and phone number
        const messageBox = document.getElementById("message");
        const message = `Email: ${email}\nPhone: ${phone}\n\nMessage:\n` + messageBox.value;

        // Set the message field with the email and phone
        messageBox.value = message;

        // Hide the error popup and proceed with form submission
        document.getElementById("errorPopup").style.display = "none";

        // Allow form submission to Formspree
        document.getElementById("form").submit();
        return true;
      }
    }

    function closeErrorPopup() {
      document.getElementById("errorPopup").style.display = "none";
    }
  </script>

</body>
</html>
